# mylog 主配置
# 敏感项（ES 账号密码）不要写在这里，用环境变量 MYLOG_ES_USERNAME / MYLOG_ES_PASSWORD 注入

server:
  port: 8080
  mode: debug          # debug / release / test
  read_timeout: 10     # 秒
  write_timeout: 10    # 秒
  allow_origins:       # 学习项目放开跨域，生产环境请改为具体域名
    - "*"

es:
  addresses:
    - http://127.0.0.1:9200
  index: diary
  username: ""         # MYLOG_ES_USERNAME
  password: ""         # MYLOG_ES_PASSWORD
  timeout: 10          # 秒
  max_retries: 3
  agg_size: 100        # terms 聚合桶数量上限

page:
  default_size: 10
  max_size: 100

log:
  level: info
  dir: ./logs
  max_size: 100        # MB
  max_backups: 7
  max_age: 30          # 天
  compress: true
  console: true
